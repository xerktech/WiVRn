name: Socket tests
on: [push, pull_request]
jobs:
  sockets-ut:
    name: Authenticated socket records
    runs-on: ubuntu-24.04
    if: ${{ vars.APK_ONLY == '' }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev libboost-dev libmagicenum-dev
    # Built standalone: the CMake target needs the full client/server dependency set
    - name: Build wivrn_sockets_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Icommon
        common/wivrn_sockets_ut.cpp common/wivrn_sockets.cpp common/crypto.cpp common/smp.cpp
        -lssl -lcrypto -o wivrn_sockets_ut
    - name: Run wivrn_sockets_ut
      run: ./wivrn_sockets_ut
    - name: Build handshake_pool_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Icommon -Iserver
        server/handshake_pool_ut.cpp common/wivrn_sockets.cpp common/crypto.cpp common/smp.cpp
        -lssl -lcrypto -o handshake_pool_ut
    - name: Run handshake_pool_ut
      run: ./handshake_pool_ut
    # Packet definitions need OpenXR headers newer than Ubuntu's: same release as CMakeLists.txt
    - name: Fetch OpenXR headers
      run: |
        curl -sSfL -o openxr.tar.gz https://github.com/KhronosGroup/OpenXR-SDK/archive/refs/tags/release-1.1.59.tar.gz
        echo "d45d12d71cbe381a6fc510ec95ec84a88fe30724674e63bb038dfc9a481d8885  openxr.tar.gz" | sha256sum -c
        tar xzf openxr.tar.gz --strip-components=1 --wildcards '*/include/openxr/*'
    - name: Build authenticate_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined
        -Icommon -Iserver -Iserver/driver -Iinclude
        server/driver/authenticate_ut.cpp server/driver/authenticate.cpp common/wivrn_sockets.cpp
        common/crypto.cpp common/smp.cpp common/secrets.cpp -lssl -lcrypto -o authenticate_ut
    - name: Run authenticate_ut
      run: ./authenticate_ut
    # fenrir front door client (XERK-2809): pairing code, TLS identity, fenrir.json store
    - name: Build fenrir_ut (ASan/UBSan)
      run: |
        sudo apt-get install -y libcurl4-openssl-dev libsimdjson-dev
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
          -Icommon -Iclient client/tests/fenrir_ut.cpp client/fenrir.cpp client/utils/json_string.cpp \
          common/identity.cpp common/crypto.cpp -lsimdjson -lcurl -lssl -lcrypto -o fenrir_ut
    - name: Run fenrir_ut
      run: ./fenrir_ut
