name: Socket tests
on: [push, pull_request]
jobs:
  sockets-ut:
    name: Authenticated socket records
    runs-on: ubuntu-24.04
    if: ${{ vars.APK_ONLY == '' }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev libboost-dev libmagicenum-dev
    # Built standalone: the CMake target needs the full client/server dependency set
    - name: Build wivrn_sockets_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Icommon
        common/wivrn_sockets_ut.cpp common/wivrn_sockets.cpp common/crypto.cpp common/smp.cpp
        -lssl -lcrypto -o wivrn_sockets_ut
    - name: Run wivrn_sockets_ut
      run: ./wivrn_sockets_ut
    - name: Build handshake_pool_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Icommon -Iserver
        server/handshake_pool_ut.cpp common/wivrn_sockets.cpp common/crypto.cpp common/smp.cpp
        -lssl -lcrypto -o handshake_pool_ut
    - name: Run handshake_pool_ut
      run: ./handshake_pool_ut
    # Packet definitions need OpenXR headers newer than Ubuntu's: same release as CMakeLists.txt
    - name: Fetch OpenXR headers
      run: |
        curl -sSfL -o openxr.tar.gz https://github.com/KhronosGroup/OpenXR-SDK/archive/refs/tags/release-1.1.59.tar.gz
        echo "d45d12d71cbe381a6fc510ec95ec84a88fe30724674e63bb038dfc9a481d8885  openxr.tar.gz" | sha256sum -c
        tar xzf openxr.tar.gz --strip-components=1 --wildcards '*/include/openxr/*'
    - name: Build authenticate_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined
        -Icommon -Iserver -Iserver/driver -Iinclude
        server/driver/authenticate_ut.cpp server/driver/authenticate.cpp common/wivrn_sockets.cpp
        common/crypto.cpp common/smp.cpp common/secrets.cpp -lssl -lcrypto -o authenticate_ut
    - name: Run authenticate_ut
      run: ./authenticate_ut
    # fenrir front door client (XERK-2809): pairing code, TLS identity, fenrir.json store,
    # and a fake front door that must not get pinned without the user (XERK-2816)
    - name: Build fenrir_ut (ASan/UBSan)
      run: |
        sudo apt-get install -y libcurl4-openssl-dev libsimdjson-dev
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
          -Icommon -Iclient client/tests/fenrir_ut.cpp client/fenrir.cpp client/utils/json_string.cpp \
          common/identity.cpp common/crypto.cpp -pthread -lsimdjson -lcurl -lssl -lcrypto -o fenrir_ut
    - name: Run fenrir_ut
      run: ./fenrir_ut
    # fenrir pairing page QR code (XERK-2812): the headset's decoder reads fenrir's rendering.
    # zxing-cpp is the version and hash CMakeLists.txt fetches for the Quest build.
    - name: Build qr_ut
      run: |
        curl -sSfL -o zxing.tar.gz https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v3.1.1.tar.gz
        echo "7286b1e6ade66fe82b7c8208b4595deeb55d6486b410834fdc65702f46650542  zxing.tar.gz" | sha256sum -c
        tar xzf zxing.tar.gz
        cmake -S zxing-cpp-3.1.1 -B zxing-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
          -DZXING_WRITERS=OFF -DZXING_C_API=OFF -DZXING_EXAMPLES=OFF -DZXING_ENABLE_AZTEC=OFF \
          -DZXING_ENABLE_DATAMATRIX=OFF -DZXING_ENABLE_MAXICODE=OFF -DZXING_ENABLE_1D=OFF \
          -DZXING_ENABLE_PDF417=OFF
        cmake --build zxing-build -j"$(nproc)"
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
          -Icommon -Iclient -Izxing-cpp-3.1.1/core/src -Izxing-build/core \
          client/tests/qr_ut.cpp client/android/qr_decode.cpp client/fenrir.cpp client/utils/json_string.cpp \
          common/identity.cpp common/crypto.cpp zxing-build/core/libZXing.a \
          -pthread -lsimdjson -lcurl -lssl -lcrypto -o qr_ut
    - name: Run qr_ut
      run: ./qr_ut
    # G920 wheel driver logic (XERK-2851): report descriptor, input decoding, HID++ FF encoding
    - name: Build wheel_ut (ASan/UBSan)
      run: >
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined
        -Icommon -Iclient -Iinclude
        client/tests/wheel_ut.cpp client/wheel/g920.cpp common/crypto.cpp common/smp.cpp
        -lssl -lcrypto -o wheel_ut
    - name: Run wheel_ut
      run: ./wheel_ut
    # Wheels (XERK-2850): packet serialization, the fenrir helper socket against a fake helper,
    # and a real uinput wheel with a force-feedback upload round trip (root + uinput module)
    - name: Build wivrn_wheel_ut (ASan/UBSan)
      run: |
        sudo apt-get install -y nlohmann-json3-dev
        g++ -std=c++23 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
          -Icommon -Iserver -Iserver/driver -Iinclude \
          server/driver/wivrn_wheel_ut.cpp server/driver/wivrn_wheel.cpp server/driver/wivrn_uinput.cpp \
          common/wivrn_sockets.cpp common/crypto.cpp common/smp.cpp -lssl -lcrypto -o wivrn_wheel_ut
    - name: Run wivrn_wheel_ut
      run: |
        sudo modprobe uinput
        sudo WIVRN_REQUIRE_UINPUT=1 ./wivrn_wheel_ut
