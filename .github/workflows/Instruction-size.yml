name: Instruction file size
on:
  pull_request:
    paths: ['**/CLAUDE.md', '**/CLAUDE.local.md', '.claude/rules/**', 'AGENTS.md']
  push:
    paths: ['**/CLAUDE.md', '**/CLAUDE.local.md', '.claude/rules/**', 'AGENTS.md']
jobs:
  size:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    # Claude Code warns and follows instructions less well past 40,000 characters per file
    - name: Every instruction file under 40000 characters
      run: |
        status=0
        while IFS= read -r f; do
          n=$(wc -m < "$f")
          if [ "$n" -ge 40000 ]; then echo "::error file=$f::$n characters (limit 40000)"; status=1; fi
        done < <(git ls-files '*CLAUDE.md' '*CLAUDE.local.md' '.claude/rules/*' 'AGENTS.md')
        exit $status
