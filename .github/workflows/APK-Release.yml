name: Release APK Only

# xerktech fork: publish a signed Quest APK built from this repository's own
# commit, so the headset speaks the same protocol (AEAD revision, pinned server
# key) as a wivrn-server built from that commit. See docs/xerktech-quest.md.
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA (or branch/tag) to build and release'
        required: true

permissions:
  contents: read

# Per commit: a push and a dispatch of the same commit cannot race on one
# release, while runs for different commits are never cancelled.
concurrency:
  group: apk-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  build-android-only:
    name: Android
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      version: ${{ steps.rev.outputs.version }}
      release: ${{ steps.rev.outputs.release }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}
        # Full history and tags so git describe gives a meaningful version.
        fetch-depth: 0
        fetch-tags: true

    # This workflow's own apk-<sha> release tags would otherwise win in
    # git describe (here and in cmake/GitVersion.cmake).
    - name: Resolve commit
      id: rev
      run: |
        git tag -l 'apk-*' | xargs -r git tag -d
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "version=$(git describe --tags --always | sed 's/^v\([0-9]\)/\1/')" >> "$GITHUB_OUTPUT"
        # Release and APK name: wivrn-quest-MAJOR.MINOR.PATCH, where MAJOR.MINOR is the
        # upstream release this fork is on and PATCH counts commits since its vMAJOR.MINOR
        # tag, so it grows with every master commit.
        TAG=$(git describe --tags --abbrev=0)
        MM=$(echo "$TAG" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\1.\2/')
        if ! [[ "$MM" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "::error::cannot read MAJOR.MINOR from tag $TAG"
          exit 1
        fi
        BASE=$(git rev-parse -q --verify "refs/tags/v$MM" || git rev-parse -q --verify "refs/tags/$MM" || echo "$TAG")
        echo "release=wivrn-quest-$MM.$(git rev-list --count "$BASE..HEAD")" >> "$GITHUB_OUTPUT"

    # Gradle distribution and the Android plugin's dependencies.
    - uses: actions/cache@v5
      with:
        key: gradle-android-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        restore-keys: gradle-android-

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install glslang-tools spirv-tools librsvg2-bin gettext npm
        wget https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.0/KTX-Software-4.4.0-Linux-x86_64.deb
        sudo dpkg --install KTX-Software-4.4.0-Linux-x86_64.deb
        npm install --global @gltf-transform/cli@4.1.1

    # An unsigned APK cannot be installed, so never publish one.
    - name: Signing key
      env:
        APK_SIGNINGKEYPASSWORD: ${{ secrets.APK_SIGNINGKEYPASSWORD }}
        APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
      run: |
        if [[ -z "$APK_SIGNINGKEYPASSWORD" || -z "$APK_KEYSTORE_BASE64" ]]; then
          echo "::error::APK_SIGNINGKEYPASSWORD / APK_KEYSTORE_BASE64 secrets are not set"
          exit 1
        fi
        echo signingKeyPassword="$APK_SIGNINGKEYPASSWORD" > gradle.properties
        echo "$APK_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > ks.keystore

    - name: Build
      env:
        VERSION: ${{ steps.rev.outputs.version }}
      run: |
        chmod +x gradlew
        ./gradlew \
          -Pwivrn_version="$VERSION" \
          -Pwivrn_versionCode="$(git rev-list --count HEAD)" \
          -Psuffix=".xerktech" \
          -Pwivrn_css=images/wivrn-nightly.css \
          -Pwivrn_app_name="WiVRn XerkTech" \
          -Pwivrn_compress_glb=ON \
          assembleRelease

    - name: Verify signature
      run: |
        APK=$(find build/outputs/apk/ -name "*.apk")
        BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
        mkdir apk
        mv "$APK" apk/${{ steps.rev.outputs.release }}.apk

    - name: Archive APK
      uses: actions/upload-artifact@v7
      with:
        name: apk
        path: apk/*.apk
        retention-days: 7

  release:
    name: Create APK release
    runs-on: ubuntu-24.04
    needs: build-android-only
    permissions:
      contents: write

    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v8
      with:
        name: apk
        path: apk

    - name: APK Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "apk-${{ needs.build-android-only.outputs.sha }}"
        target_commitish: ${{ needs.build-android-only.outputs.sha }}
        name: ${{ needs.build-android-only.outputs.release }}
        body: |
          Signed Quest client ${{ needs.build-android-only.outputs.version }}, built from ${{ needs.build-android-only.outputs.sha }}.
          Only connects to a wivrn-server built from this same commit.
          Install: docs/xerktech-quest.md.
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: apk/*.apk
